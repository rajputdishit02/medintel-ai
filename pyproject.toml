[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medintel-ai"
version = "0.3.0"
description = "Explainable clinical analytics and medical research intelligence foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<4", "scikit-learn>=1.5,<2"]

[tool.setuptools.packages.find]
where = ["src"]
