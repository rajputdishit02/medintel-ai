[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medintel-ai"
version = "1.0.0"
description = "Explainable clinical analytics and medical research intelligence foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "openai>=2,<3",
  "pandas>=2.2,<4",
  "python-dotenv>=1,<2",
  "scikit-learn>=1.5,<2",
  "shap>=0.46,<1",
  "streamlit>=1.57,<2",
  "uvicorn>=0.30,<1",
]

[project.scripts]
medintel-api = "medintel.api:run"
medintel-app = "medintel.app:run"

[tool.setuptools.packages.find]
where = ["src"]
